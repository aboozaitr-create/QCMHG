html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:17px/1.7 "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}

h1{font-size:22px;margin:0 0 8px}h2{font-size:19px;margin:12px 0}

button{font:inherit;cursor:pointer}

.main{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 20px;margin-top:12px;width:100%}
.fb{margin-top:10px;font-size:15px;color:var(--mu)}.fb b{color:var(--tx)}
.big{font-size:44px;font-weight:700;color:var(--pr);text-align:center;margin:6px 0}
.sub{background:none;border:1px dashed var(--bd);border-radius:10px;color:var(--pr);padding:6px 12px;margin:8px 8px 0 0}.sub:disabled{opacity:.5}.box{background:var(--okb);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:right}
</style>

["g","يدرس علم التنظيم الذاتي (السبرنيطيقا):","عمليات التحكم والتوجيه والحركة في الكائنات الحية والآلات","التضاريس والمناخ والغطاء النباتي في الأقاليم الكبرى","الحضارات القديمة وتطور الكتابة والمعمار","العلاقات الدولية والتكتلات الاقتصادية الإقليمية","وقد فتح آفاقا جديدة في البحث الجغرافي."],
["g","أخذت الجغرافيا الجديدة بالنسق الفرضي الاستدلالي الذي أتى أكله في:","العلوم التجريبية","الآداب الكلاسيكية","العلوم التاريخية","الفلسفة الألمانية","وذلك بالرياضيات والإحصاء في صياغة الفرضيات."],
["g","انطلقت محاولات التطوير والتجديد الجغرافي بعد الحرب من العالم:","الأنجلوسكسوني","الفرنسي","الألماني","الروسي","وفي عنوان الكتاب: البلدان الأنجلوسكسونية تتزعم القافلة."],
["g","يُعد من رواد الجغرافيا العصرية:","همبلت وريتر","ساور وهارتشورن","بورديو وباسرون","لوبلي وراتزل","وعنون الكتاب البحث عن مفاتيح الحضارة."],
["g","من الطروحات الجديدة في فلسفة العلوم التي يعرضها الفصل الرابع «المخاض العسير»:","مدرسة فرنكفورت والنظرية النقدية","مدرسة بركلي والجغرافيا الحضارية","الجغرافيا الاحتمالية عند فيدال","الحتمية البيئية عند راتزل","ويعرض أيضا بديل الماركسية."],
["g","تضم جغرافيات القرن التاسع عشر في الكتاب الجغرافيا:","الغائية والبيئية والمشهدية","الكمية والسلوكية والإنسانية","الحضارية والاقتصادية والسياسية","الوظيفية والإقليمية والبركلية","وفقا لفهرس الفصل الأول (البناء الهش)."],
["g","يرى كلفال أن الجدلية بين الكل والجزء التي تبناها فيدال دو لابلاش أخذها عن:","ريتر","راتزل","هتنر","لوبلي","وهي سمة الفكر الجغرافي في رأيه."],
["e","حسب الملخص، صدر القانون الإطار عقب:","الرؤية الاستراتيجية التي كشفت اختلالات المنظومة","إقرار مدونة الأسرة الجديدة بعد النقاش العمومي","ظهير الحماية الفرنسية على المغرب","إحداث الجامعات الجهوية بعد الاستقلال","فقد كشفت الرؤية الاستراتيجية عن اختلالات المنظومة."],
["e","يتكون القانون الإطار من:","عشرة أبواب","ستة أبواب","ثمانية أبواب","اثني عشر بابا","وهي: أحكام عامة، المبادئ والأهداف، المكونات، الولوج، المناهج، الموارد البشرية، الحكامة، التمويل، التقييم، أحكام ختامية."],
["e","المقصود بـ«ت.وت.وب.ع» في القانون الإطار:","التربية والتكوين والبحث العلمي","التعليم والتوجيه والبحث والإعلام","التربية والتوجيه والبحث العلمي","التعليم والتكوين والبحث والتفتيش","وهو اختصار منظومة التربية والتكوين والبحث العلمي."],
["e","من رافعات الإنصاف وتكافؤ الفرص:","إلزامية التعليم الأولي","تقليص السنة الدراسية","إلغاء المراقبة المستمرة","توحيد لغة التدريس","ومنها تعليم دامج وتضامني والتصدي للهدر والانقطاع ومحاربة الأمية."],
["e","من إجراءات تعليم الجودة العالية:","اعتماد التناوب اللغوي","إلغاء مهن التدريس","تقليص البحث العلمي","حذف التعليم الأولي","ومنها مراجعة المناهج وتنمية الحس النقدي."],
["e","ضمن القطاع غير النظامي:","برامج محو الأمية","التعليم العتيق التقليدي","التكوين المهني المؤهل","التعليم العالي الجامعي","ويضم أيضا التربية غير النظامية وتعليم أبناء الجالية."],
["e","يضم القطاع النظامي:","التعليم المدرسي والأصيل والتكوين المهني والعتيق والعالي","برامج محو الأمية وتعليم الكبار فقط","برامج التربية غير النظامية للمنقطعين","برامج تعليم أبناء الجالية بالخارج","أما القطاع غير النظامي فيضم برامج التربية غير النظامية ومحو الأمية وتعليم أبناء الجالية."],
["e","يُدمج التعليم الأولي في الابتدائي ويربطان بالإعدادي في إطار:","سلك التعليم الإلزامي","سلك التعليم العالي","سلك التكوين المهني","سلك التعليم العتيق","وتقام روابط بين التعليم المدرسي والتكوين المهني في الإعدادي."],
["e","لتعميم التعليم الإلزامي بالعالم القروي ينص القانون الإطار على إحداث:","المدارس الجماعاتية","مدارس البعثات","الجامعات الجهوية","مجالس القرى","مع وضع برامج للتمدرس الاستدراكي."],
["e","يوضع كجزء من الأنظمة الداخلية للمؤسسات:","ميثاق المتعلم","دليل المفتش","مدونة السير","ميثاق الجماعة","وهو من مقتضيات الولوج والاستفادة."],
["e","يقصد بالتناوب اللغوي:","تدريس بعض المواد العلمية والتقنية بلغات أجنبية","تدريس جميع المواد بالعربية دون اللغات الأجنبية","حذف اللغة الأمازيغية من البرامج الدراسية","التناوب بين الأقسام في تدريس اللغات","مع تمكين أطر التدريس من كفايات لغوية."],
["e","الهيئة المحدثة للملاءمة بين التكوينات المهنية وحاجات سوق الشغل:","مرصد الملاءمة","مجلس المنافسة","الصندوق الوطني للبحث","المرصد الوطني للمناخ","وتُحدث أيضا شبكات للتربية والتكوين محليا وجهويا."],
["e","من آليات الحكامة التي نص عليها القانون الإطار:","اعتماد مشروع المؤسسة","مركزة القرار","إلغاء الشراكات الجهوية","حذف الأكاديميات","مع نهج سياسة اللامركزية وتشجيع الشراكات الجهوية."],
["e","حسب باب التمويل، يبقى التعليم الإلزامي:","مجانيا","مؤدى عنه كليا","ممولا من الأسر وحدها","بلا تمويل عمومي","مع إحداث صندوق خاص لدعمه وأداء الأسر الميسورة لرسوم التسجيل."],
["e","يتولى تقييم مكونات المنظومة:","الوزارة والمجلس الأعلى للتربية والتكوين","الأسر والجمعيات الأهلية وحدها","مجالس الجماعات الترابية وحدها","الأحزاب السياسية والنقابات وحدها","من حيث المردودية والأداء وحجم الإنفاق والتمويل."],
["e","نص الباب الختامي على إحداث:","لجنة وطنية لتتبع ومواكبة إصلاح المنظومة","مجلس وطني للبحث العلمي والابتكار والتجديد","مرصد للملاءمة بين التكوينات المهنية وسوق الشغل","صندوق وطني لدعم محو الأمية والتربية","كما نص على برمجة زمنية لإعداد النصوص التنظيمية."],
["e","من وظائف المنظومة:","التنشئة الاجتماعية ونشر المعرفة وتطوير البحث والابتكار","خوصصة التعليم العمومي وتقليص دور الدولة","حذف بعض المواد الدراسية الأساسية والاجتماعية","تقليص التعلم المنتظم وتجزيء المحتويات الدراسية","ومنها تحقيق الاندماج الثقافي للمتعلم."],
["e","يعتبر القانون الإطار الاستثمار في المنظومة:","استثمارا منتجا في الرأسمال البشري ورافعة للتنمية","عبئا ماليا ثقيلا على ميزانية الدولة العمومية","ترفا اجتماعيا غير ضروري للمجتمع","إنفاقا استهلاكيا بلا أثر على التنمية","وهو من مبادئه ومرتكزاته."],
["e","من أهداف المنظومة تأمين فرص:","التعلم مدى الحياة","التقاعد المبكر للأساتذة","الهجرة الدولية للأطر","السياحة الثقافية الداخلية","وتشجيع الإبداع والابتكار وصقل الحس النقدي."],
["e","من مقتضيات القانون الإطار في الموارد البشرية:","التزام الشركاء بميثاق تعاقدي لأخلاقيات المهنة","إلغاء التكوين المستمر","إلغاء معايير الولوج لمهن التربية","التعاقد دون تكوين","مع استفادة الأطر من التكوين المستمر."],
["d","عناصر المنهاج:","الأهداف والمحتويات والطرائق والوسائل وأساليب التقويم","الأهداف فقط","الكتب والأقسام","الأساتذة والتلاميذ","وللمنهاج مدخلات ومخرجات وأسس فلسفية ونفسية واجتماعية ومعرفية."],
["d","الكفاية الأساس هي:","الحد الأدنى الذي ينبغي توفره في المتعلم ليواصل تعلمه في المستويات الموالية","أعلى مستوى يبلغه المتفوقون","كفاية خاصة بالإدارة","كفاية خاصة بالمدرس","فهي شرط مواصلة التعلم."],
["d","التعاقد الديداكتيكي هو التعاقد بين:","المدرس والمتعلم في علاقتهما بالمعرفة وتحديد أدوار كل طرف","الأسرة والإدارة","المدرس والإدارة","المتعلمين فيما بينهم","أما التعاقد البيداغوجي فيحكم العلاقة بين المدرس وجماعة الفصل."],
["d","التدريس الفعال تدريس:","يجعل المتعلم محور العملية بتنويع الطرائق وتنمية المهارات","يعتمد الإلقاء والتلقين","يقوم على الحفظ","يركز على المدرس","ويبتعد عن الإلقاء والتلقين."],
["d","الديداكتيك هو:","علم التدريس: دراسة علمية لمحتويات وطرق التدريس وتفاعل المدرس والمتعلمين","علم الإدارة","علم التغذية","دراسة الاقتصاد","بينما البيداغوجيا حقل يدرس الظواهر التربوية والمناهج والتقنيات."],
["d","الغايات عبارات:","فلسفية عامة مجردة بعيدة المدى","إجرائية قصيرة المدى","قابلة للقياس","خاصة بدرس واحد","تمثل المستوى النظري الضابط لتوجهات النظام التربوي."],
["d","المرامي والمقاصد:","أقل عمومية وتجريدا من الغايات وهي وسيلة لتحقيقها","أكثر تجريدا من الغايات","مرادف للأهداف الإجرائية","مرادف للتقويم","وهي أوضح من الغايات."],
["d","المقطع هو:","مجموعة وحدات صغرى مترابطة برباط المهمة أو الهدف المتوخى","الدرس كاملا","الامتحان","الحصة الواحدة","ويشكل جزءا من الدرس."],
["d","المؤشر:","سلوك قابل للملاحظة يدل على مدى التقدم في اكتساب الكفاية وهو مرتبط بالمعايير","دقة النتيجة المطلوبة","غاية فلسفية","عقد بين الأطراف","وهو أكثر إجرائية من المعيار."],
["d","المعيار هو:","دقة النتيجة أو الجواب أو الأداء توضع لتقييم درجة تملك الكفاية","سلوك ملاحظ فقط","أداة تدريس","طريقة تنشيط","ويُدرج مجموعة مؤشرات لتبيين احترام المعيار."],
["d","يتكون السند من:","السياق والتعليمة والوظيفة","المهمة والموارد والزمن","الهدف والمحتوى والتقويم","الغايات والمرامي والأهداف","أما التعليمة فتبين ما سيقوم به المتعلم من نشاط."],
["d","من رواد النظرية السلوكية:","واطسون وسكينر","كوهلر وكوفكا","بياجي","فيغوتسكي","تؤكد المحاولة والتكرار والخطأ وتغير الاستجابات."],
["d","ترى الجشطلتية (كوهلر وكوفكا) أن:","الكل لا يساوي مجموع الأجزاء","التعلم يحدث بالمحاولة والخطأ","التعلم ملاحظة وتقليد","التعلم تعزيز مادي","لذلك ينطلق المتعلم من الكل إلى الأجزاء وصولا إلى الاستبصار."],
["d","المراقبة المستمرة إجراء بيداغوجي:","يقيّم أداءات المتعلمين بكيفية مستمرة ليتعرفوا إمكانياتهم ويطوروها","يقيّم مرة في نهاية السنة","خاص بالإدارة","يلغي الامتحان","فتمكنهم من معرفة مردودهم."],
["d","من خصائص الكفاية:","معطى غير ثابت تكتسب بعد مسار تكويني وذات طابع وظيفي","ثابتة لا تتطور","لا تقبل التقويم","مستقلة عن المادة الدراسية","ومن خصائصها النسقية والغائية والارتباط بمادة دراسية."],
["d","القدرة مفهوم:","افتراضي يختزل عمليات فكرية ووجدانية، وهي عرضانية وغير قابلة للتقويم المباشر","ملاحظ مباشرة وقابل للقياس","خاص بمادة واحدة","سلوك آلي","أما المهارة فهي أداءات تؤشر على تجلي القدرة."],
["d","تمر المهارة بثلاثة مستويات:","التقليد والمحاكاة ثم الدقة والإتقان ثم الابتكار والإبداع","الحفظ ثم الفهم ثم النسيان","التشخيص ثم العلاج ثم التقويم","الاكتشاف ثم رد الفعل ثم الفعل","وهي تساهم في تجلي القدرة."],
["d","من سلبيات بيداغوجيا الأهداف التي أدت إلى تبني المقاربة بالكفايات:","الإفراط في الأجرأة وتهميش الأهداف المركبة","نقص عدد المدرسين","قلة الكتب","كثرة الامتحانات","ومنها الارتباط بالصنافات والاستناد إلى المدرسة السلوكية."],
["d","من المرجعيات النظرية للمقاربة بالكفايات:","علم النفس الفارقي ونظرية الذكاءات المتعددة","الفيزياء النووية","الجيولوجيا","علم الفلك","إلى جانب النظريات المعرفية والبنائية والسوسيوبنائية."],
["d","التعلم عملية:","ذاتية يستدل عليها بتغير في السلوك القابل للملاحظة والقياس يتسم بثبات نسبي","خارجية دائما","مرادفة للتعليم","مؤقتة جدا","وتؤثر فيها عوامل كالنضج والدافعية والاستعداد."],
["d","النقل الديداكتيكي هو:","التحولات التي تطرأ على المعرفة العالمة عند تحويلها إلى معرفة مدرسية","نقل المتعلمين بين الأقسام","نقل المعارف بين المدرسين","توزيع الحصص","مفهوم أساسي في تخطيط التعلمات."],
["d","الترتيب الصحيح لمستويات النقل الديداكتيكي:","معرفة عالمة ثم مدرسية ثم مدرَّسة ثم مستوعَبة","مدرَّسة ثم عالمة ثم مستوعَبة ثم مدرسية","مستوعَبة ثم مدرَّسة ثم مدرسية ثم عالمة","مدرسية ثم مستوعَبة ثم عالمة ثم مدرَّسة","تتحول المعرفة من البحث العلمي إلى المتعلم."],
["d","المعرفة المدرسية في سلسلة النقل الديداكتيكي من إنجاز:","لجان التأليف","المدرس","المتعلم","البحث العلمي","أما المعرفة المدرَّسة فيقدمها المدرس."],
["d","من قواعد النقل الديداكتيكي:","اليقظة الديداكتيكية والموضوعية وفصل المعرفة المدرسية عن المواقف الشخصية","إخفاء المصادر","فرض الرأي الشخصي","تجاهل مستوى المتعلمين","إضافة إلى الصدق والأمانة العلمية والبرمجة التدريجية."],
["d","من ضوابط النقل الديداكتيكي:","مراعاة المستوى الإدراكي للمتعلمين وتمثلاتهم","تجاهل التمثلات","حذف الوضعيات","تقديم معرفة جاهزة","وتحديد المعارف الأساسية والإلمام بالعوائق الإبستمولوجية."],
["d","الموارد هي:","كل ما يحتاج المتعلم تعبئته لحل وضعية مشكلة من معارف ومهارات ومواقف","الكتب المدرسية فقط","الامتحانات","الأجور","وهي داخلية أو خارجية."],
["d","من أنواع المضامين بالدرس:","المعرفية والمنهجية والمهارية والحس حركية والسوسيوعاطفية","المالية والإدارية","الأمنية","الإعلامية","وهي المحتوى التعليمي المراد اكتسابه."],
["d","من معايير اختيار المضمون:","الملاءمة وخدمة أهداف التعلم واكتساب الطابع المدرسي والتوظيف السليم","الطول","التعقيد","الندرة","ومن موجهاته تجاوز التراكم الكمي."],
["d","من المضامين المنهجية الفكرية:","إتقان خطوات النهج التاريخي والجغرافي والاشتغال على الوثائق","إنجاز مبيان","التوطين على خريطة","ترسيخ القيم","أما إنجاز المبيان والتوطين فمضامين مهارية حس حركية."],

  const un=Q.filter(q=>q[0]==DOM&&q.t==DOM+"0");if(un.length){const b=document.createElement("button");b.className="opt";b.textContent=`أسئلة غير مصنفة (${un.length} سؤالا)`;b.onclick=()=>{L=un;chooser()};bx.appendChild(b)}
  $("#bk0").before(hd,bx)}
}
function chooser(){
 const n=Math.ceil(L.length/B);
 app.innerHTML=`<h1>اختر الكتلة</h1><p>كل كتلة ${B} سؤالا، ولك أن تبدأ من أي كتلة.</p><div id="bk"></div><button class="sub" id="bk1">← تغيير المستوى</button>`;
 const add=(t,f)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=f;$("#bk").appendChild(b)};
 add("كل الكتل بالتتابع",()=>{P=L;off=0;show()});
 for(let k=0;k<n;k++)add(`الكتلة ${k+1} (${Math.min(B,L.length-k*B)} سؤالا)`,()=>{P=L.slice(k*B,(k+1)*B);off=k;show()});
 $("#bk1").onclick=levels;
}
function show(){
 if(i>=P.length)return fin();
 if(i%B==0)h=3;
 const q=P[i],o=sh(q.slice(2,6)),n=i%B,tot=Math.min(B,P.length-Math.floor(i/B)*B);
 app.innerHTML=`<div class="meta"><span>السؤال ${n+1} / ${tot} · الكتلة ${Math.floor(i/B)+1+off}</span><span class="tag">${q.b>=0?"🆕 ":""}${D[q[0]]}</span></div><div class="bar"><i style="width:${n/tot*100}%"></i></div><h2>${q[1]}</h2><div id="os"></div>${q.x[1]?`<button class="sub" id="hb">💡 تلميح (${h} متبقية في هذه الكتلة)</button><div id="ht"></div>`:""}<div id="fb"></div>`;
 const box=$("#os");
 o.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(b,t,q,box);box.appendChild(b)});
 const hb=$("#hb");
 if(hb){if(!h)hb.disabled=true;hb.onclick=()=>{h--;hb.disabled=true;hb.textContent=`💡 تلميح (${h} متبقية في هذه الكتلة)`;$("#ht").innerHTML=`<div class="box">${q.x[1]}</div>`}}
}
function pick(b,t,q,box){
 const ok=t===q[2];
 box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===q[2])x.classList.add("ok")});
 if(!ok)b.classList.add("ko");
 const hb=$("#hb");if(hb)hb.disabled=true;
 res.push({d:q[0],ok});rec(q,ok);
 const last=(i+1)%B==0||i+1>=P.length;
 $("#fb").innerHTML=`<div class="fb"><b>${ok?"إجابة صحيحة ✓":"إجابة خاطئة ✗ — الجواب الصحيح: "+q[2]}</b>${ex(q[6])?"<br>"+q[6]:""}${src(q)?"<br><small>المصدر: "+src(q)+"</small>":""}</div>${q.x[2]&&q.x[2].length>=140?`<button class="sub" id="eb">📖 إثراء: أفهم أكثر</button><div id="en"></div>`:""}<button class="main" id="nx">${last?"عرض النتيجة":"السؤال التالي"}</button>`;
 const eb=$("#eb");if(eb)eb.onclick=()=>{eb.disabled=true;$("#en").innerHTML=`<div class="box">${q.x[2]}</div>`};
 $("#nx").onclick=()=>{i++;last?blk():show()};
}
function blk(){
 const k=Math.floor((i-1)/B),it=res.slice(k*B,i),s=it.filter(x=>x.ok).length,p=pct(s,it.length);
 const rows=Object.keys(D).map(d=>{const z=it.filter(x=>x.d==d);return z.length?`<tr><td>${D[d]}</td><td>${z.filter(x=>x.ok).length} / ${z.length}</td></tr>`:""}).join("");
 const more=i<P.length,single=P.length<=B;
 app.innerHTML=`<h1>نتيجة الكتلة ${k+1+off}</h1><div class="big">${s} / ${it.length}</div><p style="text-align:center">${p}% — ${verdict(p)}</p><table>${rows}</table><button class="main" id="nb">${more?"الكتلة التالية":single?"إعادة المحاولة":"الملخص النهائي"}</button>`;
 $("#nb").onclick=more?show:single?home:fin;
}
function fin(){
 const n=Math.ceil(res.length/B),t=res.filter(x=>x.ok).length;
 let r="";for(let k=0;k<n;k++){const it=res.slice(k*B,(k+1)*B),s=it.filter(x=>x.ok).length;r+=`<tr><td>الكتلة ${k+1+off}</td><td>${s} / ${it.length}</td><td>${pct(s,it.length)}%</td></tr>`}
 app.innerHTML=`<h1>الملخص النهائي</h1><div class="big">${t} / ${res.length}</div><p style="text-align:center">${pct(t,res.length)}%</p><table>${r}</table><button class="main" id="rs">إعادة من البداية</button>`;
 $("#rs").onclick=home;
}
start();
</script>
</body>
</html>
